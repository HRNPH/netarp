[package]
name = "netarp"
version = "0.2.1"
edition = "2024"
description = "Network device discovery using ARP scanning, with SQLite (SeaORM) storage, optional GraphQL API and InfluxDB export"
license = "MIT"

[features]
default = ["graphql", "influx"]
graphql = ["dep:async-graphql", "dep:async-graphql-axum", "dep:axum"]
influx = ["dep:reqwest"]

[dependencies]
pnet = "0.34"
ipnetwork = "0.20"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio", "macros", "with-chrono"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde_json = "1"

async-graphql = { version = "7", features = ["chrono"], optional = true }
async-graphql-axum = { version = "7", optional = true }
axum = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

netarp-migration = { path = "migration" }
