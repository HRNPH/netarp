name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version (e.g. v0.2.0). Leave empty to use Cargo.toml version."
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  lowercase-name:
    runs-on: ubuntu-latest
    steps:
      - id: lower
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
    outputs:
      name: ${{ steps.lower.outputs.name }}

  build-binaries:
    needs: lowercase-name
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            binary: netarp-x86_64-linux-gnu
          - target: x86_64-unknown-linux-musl
            binary: netarp-x86_64-linux-musl
          - target: aarch64-unknown-linux-musl
            binary: netarp-aarch64-linux-musl

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.14.0"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/netarp target/${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: target/${{ matrix.binary }}

      - name: Determine version tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            REF="${GITHUB_REF_NAME}"
            if [[ "$REF" == v* ]]; then
              echo "tag=${REF}" >> "$GITHUB_OUTPUT"
            else
              VER=$(grep '^version' Cargo.toml | head -1 | awk -F'"' '{print $2}')
              echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: target/${{ matrix.binary }}
          generate_release_notes: true

  build-images:
    needs: [lowercase-name, build-binaries]
    env:
      IMAGE_NAME: ${{ needs.lowercase-name.outputs.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            binary: netarp-x86_64-linux-musl
          - platform: linux/arm64
            binary: netarp-aarch64-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.binary }}
      - name: Prepare context
        run: |
          cp ${{ matrix.binary }} netarp
          chmod +x netarp
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge-images:
    needs: [lowercase-name, build-images]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ needs.lowercase-name.outputs.name }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - name: Determine tag
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == v* ]]; then echo "tag=${REF}" >> "$GITHUB_OUTPUT";
          elif [ -n "${{ inputs.version }}" ]; then echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT";
          else
            VER=$(curl -sfL https://raw.githubusercontent.com/${{ github.repository }}/main/Cargo.toml | grep '^version' | head -1 | awk -F'"' '{print $2}')
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT";
          fi
      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
